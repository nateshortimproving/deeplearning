epic:
  name: Pantry Inventory Management
  description: As a home cook, I want to track the food items in my pantry so that
    I always know what I have, what is expiring soon, and what needs to be used before
    it goes bad.
  source_prd: sample-stories/pantry-inventory.md
stories:
- id: PANTRY-001
  title: Add Pantry Item Manually
  user_story: As a home cook, I want to manually add a food item to my pantry so that
    I can keep an accurate record of what I have on hand.
  acceptance_criteria:
  - id: PANTRY-001-AC1
    given: I am adding a new pantry item
    when: I enter all required information and confirm
    then: the item is saved and appears in my pantry inventory.
    type: positive
  - id: PANTRY-001-AC2
    given: I have saved a new item
    when: I view the inventory list
    then: the item is grouped by category and the total item count increases by one.
    type: positive
  - id: PANTRY-001-AC3
    given: I am adding a new pantry item
    when: I try to save without a required field
    then: the item is not saved and I see a clear validation message.
    type: negative
  - id: PANTRY-001-AC4
    given: I add an item with the same name as an existing item
    when: I confirm the save
    then: the existing item quantity is updated instead of creating a duplicate.
    type: edge_case
  review_status: pending
  review_notes: ''
- id: PANTRY-002
  title: Edit Existing Pantry Item
  user_story: As a home cook, I want to edit an existing pantry item so that I can
    correct mistakes or update quantities after using some of an item.
  acceptance_criteria:
  - id: PANTRY-002-AC1
    given: I am editing an existing pantry item
    when: I change a value and confirm
    then: the item is updated and I see a success confirmation.
    type: positive
  - id: PANTRY-002-AC2
    given: I update an item's quantity
    when: the quantity reaches zero
    then: the item is marked as empty and visually distinguished.
    type: positive
  - id: PANTRY-002-AC3
    given: I am editing an item
    when: I clear a required field and confirm
    then: the changes are not saved and I see a validation message.
    type: negative
  - id: PANTRY-002-AC4
    given: I am editing an item
    when: I cancel the edit
    then: no changes are saved and I return to the inventory list.
    type: edge_case
  review_status: pending
  review_notes: ''
- id: PANTRY-003
  title: Delete or Archive Pantry Item
  user_story: As a home cook, I want to remove an item from my pantry so that my inventory
    reflects only what I actually have.
  acceptance_criteria:
  - id: PANTRY-003-AC1
    given: I choose to remove a pantry item
    when: I confirm the removal
    then: the item is removed and the total item count decreases by one.
    type: positive
  - id: PANTRY-003-AC2
    given: I open the remove confirmation
    when: I cancel
    then: the item remains in the inventory unchanged.
    type: negative
  - id: PANTRY-003-AC3
    given: I remove the last item in a category
    when: the list refreshes
    then: the empty category is no longer displayed.
    type: edge_case
  review_status: pending
  review_notes: ''
- id: PANTRY-004
  title: Expiration Alerts
  user_story: As a home cook, I want to see which items are expiring soon so that
    I can prioritize using them before they go bad.
  acceptance_criteria:
  - id: PANTRY-004-AC1
    given: I have items in my pantry
    when: I view the inventory
    then: each item shows a clear indicator of how soon it expires.
    type: positive
  - id: PANTRY-004-AC2
    given: I have items expiring within 3 days
    when: I open the app
    then: I see a prominent alert that lists those items.
    type: positive
  - id: PANTRY-004-AC3
    given: I have no items expiring within 7 days
    when: I open the app
    then: no expiration alert is shown.
    type: negative
  - id: PANTRY-004-AC4
    given: an item's expiration date is today
    when: the inventory refreshes
    then: the item is shown as expiring today.
    type: edge_case
  review_status: pending
  review_notes: ''
- id: PANTRY-005
  title: Filter and Search Inventory
  user_story: As a home cook, I want to search and filter my pantry so that I can
    quickly find specific items without scrolling through the entire list.
  acceptance_criteria:
  - id: PANTRY-005-AC1
    given: I am viewing my pantry
    when: I type in the search field
    then: only items matching the search text are shown.
    type: positive
  - id: PANTRY-005-AC2
    given: I am viewing my pantry
    when: I select a category filter
    then: only items in that category are shown.
    type: positive
  - id: PANTRY-005-AC3
    given: I apply search and category filters that match no items
    when: the list renders
    then: I see an empty state with a way to clear the filters.
    type: edge_case
  review_status: changes_requested
  review_notes: The feature is functionally complete against the plan and all
    22 tests pass, but three issues block a clean pass: the API does not
    typecheck (fastify.prisma augmentation missing, Date-vs-string mismatches,
    no tsconfig), the backend returns an empty array for empty filters so the
    real initial pantry view is always empty (masked by test mocks), and the
    route tests never invoke handlers despite claiming behavioral coverage.
    Recommend fixing the type errors and empty-filter behavior, then adding
    real route tests before marking this story passed.
