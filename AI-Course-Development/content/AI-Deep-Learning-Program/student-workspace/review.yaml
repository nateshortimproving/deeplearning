issues:
  - severity: major                    # <<< NEW ISSUE 1 of 7
    category: correctness
    description: >-
      The API does not typecheck. `npx tsc` reports `Property 'prisma' does not
      exist on type 'FastifyInstance'` in api/src/routes/pantry.ts (line 7) and
      three `expirationDate: Date is not assignable to type 'string'` errors in
      api/src/services/PantryService.ts (lines 17, 37, 79). There is also no
      tsconfig.json in api/, so `npm run build` (`tsc`) never surfaces these
      errors — tsx and vitest strip types without checking, which is why the
      suite passes despite the defects. The route also returns Prisma rows
      (with createdAt/updatedAt and Date expirationDate) while the declared
      Reply type claims string dates.
    recommendation: >-
      Add a tsconfig.json to api/ so `npm run build` actually compiles the
      source. Add Fastify module augmentation
      (`declare module "fastify" { interface FastifyInstance { prisma: PrismaClient } }`).
      Either map Prisma results to the API `PantryItem` type (serializing
      expirationDate via `.toISOString()`) or change the interface's
      expirationDate to `Date` and let Fastify's response schema serialize it.
    ac_ref: general

  - severity: major                    # <<< NEW ISSUE 2 of 7
    category: correctness
    description: >-
      `PantryService.searchAndFilter("", "")` returns an empty array when both
      filters are empty, and `usePantryFilter` fetches `/api/pantry/search`
      with no params on mount. As a result the real initial pantry view always
      renders zero items until the user types a filter — the "I am viewing my
      pantry" precondition of AC1 is never met in production. The component
      tests mask this because the fetch mock returns items for unfiltered
      requests, so the defect is invisible to the suite.
    recommendation: >-
      When both filters are empty, return all pantry items (unfiltered list)
      instead of `[]`, or have the client call a dedicated list endpoint on
      mount. Add a test that exercises the real searchAndFilter empty-input
      path through the route so the behavior is pinned down.
    ac_ref: PANTRY-005-AC1

  - severity: major                    # <<< NEW ISSUE 3 of 7
    category: test_coverage
    description: >-
      api/src/routes/pantry.test.ts never invokes the registered handlers or
      asserts on responses — it only verifies that `fastify.get` was called.
      `mockPantryService` is declared but never injected (the real
      PantryService is constructed inside pantryRoutes). Test names claim
      behaviors ("returns empty array when filters match no items") that are
      not actually tested, so the route layer has effectively no behavioral
      coverage — the exact gap that let the empty-filter defect ship.
    recommendation: >-
      Use `fastify.inject()` against a real Fastify instance with a stubbed
      prisma decorator, or refactor pantryRoutes to accept the service for
      dependency injection. Assert on status codes and response bodies for
      search-only, category-only, combined, no-match, and empty-filter cases.
    ac_ref: PANTRY-005-AC3

  - severity: minor                    # <<< NEW ISSUE 4 of 7
    category: edge_case
    description: >-
      The fetch effect in usePantryFilter has no stale-response guard. If the
      user changes filters quickly and responses arrive out of order, an older
      response can overwrite newer results. The 300ms debounce reduces but
      does not eliminate this (slow first request + fast second request).
    recommendation: >-
      Track a request id/ref or use AbortController in the effect cleanup so
      only the latest response calls setItems.
    ac_ref: PANTRY-005-AC1

  - severity: minor                    # <<< NEW ISSUE 5 of 7
    category: correctness
    description: >-
      usePantryFilter.ts uses `NodeJS.Timeout` (line 20) but web/package.json
      has no @types/node dependency, so this fails typecheck in a browser
      project (`Cannot find namespace 'NodeJS'`). web/ also has no
      tsconfig.json, so `npm run build` (`tsc && vite build`) cannot run.
    recommendation: >-
      Use `ReturnType<typeof setTimeout>` for the timer ref and add a
      tsconfig.json (with vite/client types) so the web build script works.
    ac_ref: general

  - severity: nit                      # <<< NEW ISSUE 6 of 7
    category: readability
    description: >-
      The API base URL is hardcoded as `http://localhost:3001` in two places in
      usePantryFilter.ts, which breaks in any non-local environment.
    recommendation: >-
      Move the base URL to `import.meta.env.VITE_API_URL` (with a localhost
      fallback) or a shared api client module.
    ac_ref: general

  - severity: nit                      # <<< NEW ISSUE 7 of 7
    category: readability
    description: >-
      plan.yaml lists `api/prisma/migrations/001_init.sql` in files_affected,
      but the implementation created `api/prisma/migrations/001_init/migration.sql`
      (Prisma's standard layout). Functionally fine, but the plan artifact no
      longer matches the repo, which makes files_affected-based reviews
      report a missing file.
    recommendation: >-
      Update plan.yaml's files_affected to the actual migration path, or note
      the convention deviation in the plan.
    ac_ref: general
# ============================================================================
